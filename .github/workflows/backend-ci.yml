name: PayFlow Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests and PostgreSQL migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend
        shell: bash

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: payflow_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_only_42
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payflow_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      FRONTEND_URL: http://localhost:5173
      BROWSER_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg://payflow_runtime:ci_runtime_only_42@localhost:5432/payflow_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://payflow_migrator:ci_migrator_only_42@localhost:5432/payflow_db
      CSRF_SECRET: ci-only-csrf-secret-000000000000000000000000000000000000
      LOGIN_THROTTLE_SECRET: ci-only-throttle-secret-111111111111111111111111111111111111

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install locked Python dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip check
          python -m pytest --version

      - name: Prepare isolated PostgreSQL roles
        env:
          PGPASSWORD: ci_postgres_only_42
        run: |
          psql -h localhost -U postgres -d payflow_db -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE payflow_migrator LOGIN PASSWORD 'ci_migrator_only_42';
          CREATE ROLE payflow_runtime LOGIN PASSWORD 'ci_runtime_only_42';

          GRANT CONNECT ON DATABASE payflow_db TO payflow_migrator;
          GRANT CONNECT ON DATABASE payflow_db TO payflow_runtime;

          CREATE SCHEMA payflow AUTHORIZATION payflow_migrator;
          GRANT USAGE ON SCHEMA payflow TO payflow_runtime;

          ALTER DEFAULT PRIVILEGES
            FOR ROLE payflow_migrator IN SCHEMA payflow
            GRANT SELECT, INSERT, UPDATE, DELETE
            ON TABLES TO payflow_runtime;

          ALTER DEFAULT PRIVILEGES
            FOR ROLE payflow_migrator IN SCHEMA payflow
            GRANT USAGE, SELECT, UPDATE
            ON SEQUENCES TO payflow_runtime;
          SQL

      - name: Apply Alembic migrations
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Verify database revision and runtime permissions
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import text

          from app.core.database import engine

          head = ScriptDirectory.from_config(
              Config("alembic.ini")
          ).get_current_head()

          with engine.connect() as conn:
              current = conn.execute(
                  text("SELECT version_num FROM payflow.alembic_version")
              ).scalar_one()

              assert current == head

              role = conn.execute(
                  text("SELECT current_user")
              ).scalar_one()

              assert role == "payflow_runtime"

              for privilege in ("UPDATE", "DELETE", "TRUNCATE"):
                  allowed = conn.execute(
                      text("""
                          SELECT has_table_privilege(
                              current_user,
                              'payflow.audit_events',
                              :privilege
                          )
                      """),
                      {"privilege": privilege},
                  ).scalar_one()

                  assert not allowed, privilege

          print("PASS: Migrations and runtime privileges")
          PY

      - name: Run complete backend test suite
        run: python -m pytest -q

  security:
    name: Dependency and source security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Scan source for selected secret patterns
        run: python scripts/check_secrets.py

      - name: Install dependency auditor
        run: python -m pip install pip-audit

      - name: Audit pinned dependencies
        run: |
          python -m pip_audit \
            --no-deps \
            --disable-pip \
            -r backend/requirements.lock.txt
